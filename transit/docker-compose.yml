services:
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla_brest
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data
    command: valhalla_service /data/valhalla.json 1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
